name: arena-capture
on:
  push:
    branches:
      - arena/1cbfa84d-ffmpeg-cuts-design
    paths:
      - .github/workflows/arena-capture.yml
      - scripts/capture.mjs
  workflow_dispatch:
    inputs:
      B_EMAIL:
        description: 'Budgetly test email'
        required: true
        type: string
      B_PASS:
        description: 'Budgetly test password'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture real Budgetly session
        env:
          B_EMAIL: ${{ vars.BUDGETLY_TEST_EMAIL }}
          B_PASS: ${{ vars.BUDGETLY_TEST_PASSWORD }}
        run: node scripts/capture.mjs
      - name: Upload footage
        uses: actions/upload-artifact@v4
        with:
          name: budgetly-footage
          path: footage/
          if-no-files-found: warn
          retention-days: 3
      - name: Push footage to the branch
        run: |
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add footage/
          git commit -m "Add real Budgetly save/after-save footage" || echo "nothing to commit"
          git push origin HEAD:arena/1cbfa84d-ffmpeg-cuts-design
